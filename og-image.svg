<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">UnBoring - UI Design Tool</title>
  <desc id="desc">Open-source UI inspiration, prompts, CSS tokens, and agent-ready briefs for less boring AI-generated interfaces.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#1f1b16" flood-opacity=".18"/>
    </filter>
    <linearGradient id="lime" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#dfff55"/>
      <stop offset="1" stop-color="#92f252"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff9eb"/>
      <stop offset=".52" stop-color="#f7efdc"/>
      <stop offset="1" stop-color="#eaf4e8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop stop-color="#ff5d3d"/>
      <stop offset=".45" stop-color="#c8ff3d"/>
      <stop offset="1" stop-color="#3662ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#1f1b16" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#warm)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="119" cy="116" r="190" fill="#ff5d3d" opacity=".16"/>
  <circle cx="1092" cy="74" r="230" fill="#3662ff" opacity=".13"/>
  <circle cx="970" cy="620" r="280" fill="#c8ff3d" opacity=".20"/>

  <g transform="translate(72 58)">
    <rect x="0" y="0" width="1056" height="560" rx="34" fill="#fffaf0" stroke="#1f1b16" stroke-opacity=".16" filter="url(#shadow)"/>
    <rect x="22" y="22" width="1012" height="52" rx="16" fill="#fffdf7" stroke="#1f1b16" stroke-opacity=".12"/>
    <g transform="translate(44 35)">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="url(#lime)" stroke="#171717" stroke-width="2"/>
      <path d="M9 9h10v3H12v4h7v3H9z" fill="#171717"/>
      <text x="44" y="21" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">UnBoring</text>
    </g>
    <g fill="#4d473f" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">
      <text x="700" y="55">Creator</text>
      <text x="774" y="55">Motion</text>
      <text x="842" y="55">Components</text>
      <text x="948" y="55">About</text>
    </g>

    <g transform="translate(56 124)">
      <text x="0" y="0" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="4">OPEN-SOURCE UI INSPIRATION</text>
      <text x="0" y="96" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="950">Less boring</text>
      <text x="0" y="176" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="950">AI interfaces.</text>
      <text x="4" y="232" fill="#4d473f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650">Design directions, prompts, CSS tokens, and</text>
      <text x="4" y="266" fill="#4d473f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650">agent-ready briefs for vibe coders.</text>
      <g transform="translate(4 314)">
        <rect x="0" y="0" width="190" height="54" rx="16" fill="#171717"/>
        <text x="28" y="35" fill="#fffaf0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Surprise Me</text>
        <rect x="204" y="0" width="196" height="54" rx="16" fill="none" stroke="#1f1b16" stroke-opacity=".22"/>
        <text x="232" y="35" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Copy Prompt</text>
      </g>
    </g>

    <g transform="translate(590 118)">
      <rect x="0" y="0" width="402" height="396" rx="28" fill="#171717"/>
      <rect x="18" y="18" width="366" height="46" rx="15" fill="#fffaf0"/>
      <circle cx="44" cy="41" r="8" fill="#ff5d3d"/>
      <circle cx="68" cy="41" r="8" fill="#f2c94c"/>
      <circle cx="92" cy="41" r="8" fill="#c8ff3d"/>
      <rect x="274" y="31" width="82" height="20" rx="10" fill="#171717" opacity=".12"/>

      <g transform="translate(30 92)">
        <rect x="0" y="0" width="342" height="92" rx="20" fill="#fffaf0"/>
        <text x="22" y="38" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="950">Creator canvas</text>
        <rect x="22" y="56" width="138" height="11" rx="5.5" fill="#c8ff3d"/>
        <rect x="176" y="56" width="108" height="11" rx="5.5" fill="#dad1be"/>
      </g>

      <g transform="translate(30 208)">
        <rect x="0" y="0" width="158" height="124" rx="20" fill="#c8ff3d"/>
        <text x="20" y="38" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="950">Prompt</text>
        <rect x="20" y="58" width="106" height="9" rx="4.5" fill="#171717" opacity=".72"/>
        <rect x="20" y="78" width="82" height="9" rx="4.5" fill="#171717" opacity=".32"/>
      </g>
      <g transform="translate(208 208)">
        <rect x="0" y="0" width="164" height="124" rx="20" fill="#fffaf0"/>
        <text x="20" y="38" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="950">Tokens</text>
        <circle cx="34" cy="70" r="16" fill="#ff5d3d"/>
        <circle cx="74" cy="70" r="16" fill="#3662ff"/>
        <circle cx="114" cy="70" r="16" fill="#c8ff3d"/>
      </g>

      <path d="M35 358H367" stroke="url(#beam)" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
